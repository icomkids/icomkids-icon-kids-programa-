proxy_cache_path /var/cache/nginx/adhonep levels=1:2 keys_zone=adhonep_public:1m max_size=20m inactive=24h use_temp_path=off;
map $status $adhonep_public_cache_control {
    default "no-store";
    200 "public, max-age=60, stale-if-error=86400";
}

# Fixed allowlist. Client query strings, cookies and authorization are never forwarded.
map $uri $adhonep_public_query {
    default "";
    /api/public/businesses "adh_businesses?select=id,slug,name,chapter_id,segment,headline,short_description,description,logo_url,cover_url,video_url,website_url,instagram_url,facebook_url,linkedin_url,contact_email,whatsapp,offerings,differentials,service_area,featured,adh_chapters(name,city,state)&status=eq.active&order=featured.desc,name.asc&limit=1000";
    /api/public/chapters "adh_chapters?select=id,name,city,state&active=eq.true&order=city.asc&limit=1000";
    /api/public/events "adh_events?select=id,chapter_id,title,description,starts_at,ends_at,location_name,address,image_url,speaker_name,adh_chapters(name,city,state)&published=eq.true&or=(ends_at.gte.now,and(ends_at.is.null,starts_at.gte.now))&order=starts_at.asc&limit=1000";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ^~ /api/public/ {
        if ($adhonep_public_query = "") { return 404; }
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=60s ipv6=off;
        set $adhonep_api https://swsfwthjxtqtkloexyjs.supabase.co;
        proxy_pass $adhonep_api/rest/v1/$adhonep_public_query;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host swsfwthjxtqtkloexyjs.supabase.co;
        proxy_set_header apikey sb_publishable_UCpt5UUIheImRldncvyseg_8pDQixDy;
        proxy_set_header Prefer count=exact;
        proxy_set_header Accept application/json;
        proxy_ssl_server_name on;
        proxy_ssl_name swsfwthjxtqtkloexyjs.supabase.co;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 4s;
        proxy_read_timeout 8s;
        proxy_next_upstream off;
        proxy_cache adhonep_public;
        proxy_cache_key $uri;
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_lock_age 15s;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control $adhonep_public_cache_control always;
        add_header X-Public-Cache $upstream_cache_status always;
        add_header X-Catalog-Updated $upstream_http_date always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /membros {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /membros.html =404;
    }

    location = /admin {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /admin.html =404;
    }

    location = /admin/ { return 302 /admin; }
    location = /membros/ { return 302 /membros; }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /patrocinadores {
        try_files /patrocinadores.html =404;
    }

    location = /empresas {
        try_files /empresas.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:jpg|jpeg|png|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
